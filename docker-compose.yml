services:
  news840:
    build:
      context: .
      dockerfile: Dockerfile
    #### container_name: news-briefing-app
    restart: unless-stopped
    ports:
      - "3200:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - default
      - cfnet1

networks:
  cfnet1:
    external: true
    name: cfnet1

