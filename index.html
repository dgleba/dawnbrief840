<!doctype html>
<html lang="en" data-small-text="larger">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Dawnbrief</title>
    <meta name="description" content="Your custom daily audio news and podcast executive briefing." />
    
    <!-- PWA Web Manifest & Theme Colors -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6B705C" />
    <meta name="background-color" content="#F9F7F2" />

    <!-- Android PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Dawnbrief" />

    <!-- Apple iOS / macOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dawnbrief" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="Dawnbrief - Daily Audio News" />
    <meta property="og:description" content="Your custom daily audio news and podcast executive briefing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#F9F7F2] text-[#4A4A3F] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
